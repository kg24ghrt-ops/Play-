name: Build NovaCibes Python Runner (macOS Intel)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary for Intel
        run: cargo build --release --verbose --target x86_64-apple-darwin

      - name: Prepare artifact
        run: |
          mkdir -p dist
          BIN_PATH="$(find target/x86_64-apple-darwin/release -maxdepth 1 -type f -perm -111 \
            ! -name '*.d' \
            ! -name '*.rlib' \
            ! -name '*.rmeta' \
            | head -n 1)"
          if [ -z "$BIN_PATH" ]; then
            echo "No release binary found"
            ls -la target/x86_64-apple-darwin/release
            exit 1
          fi
          cp "$BIN_PATH" dist/
          chmod +x dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-macos-intel
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: novacibes-macos-intel
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
