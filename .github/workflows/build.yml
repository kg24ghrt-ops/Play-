name: Build NovaCibes Python Runner (macOS 11 Intel)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (macOS 11 Intel compatible)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target x86_64-apple-darwin --verbose

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p dist

          BIN="target/x86_64-apple-darwin/release/novacibes-python-runner"

          if [ ! -f "$BIN" ]; then
            echo "Build failed: binary not found"
            ls -R target
            exit 1
          fi

          cp "$BIN" dist/
          chmod +x dist/novacibes-python-runner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-macos11-build
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-13

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
