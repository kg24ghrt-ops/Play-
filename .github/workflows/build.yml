name: Build NovaCibes Editor (Universal macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build binary for ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Create .app bundle for ${{ matrix.target }}
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .dmg installer for ${{ matrix.target }}
        run: |
          APP_PATH=$(find target/${{ matrix.target }}/release/bundle/osx -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH")
          create-dmg \
            --volname "NovaCibes Editor" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 200 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 400 190 \
            "NovaCibes-Editor-${{ matrix.target }}.dmg" \
            "$APP_PATH"

      - name: Upload DMG for ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-editor-${{ matrix.target }}
          path: NovaCibes-Editor-${{ matrix.target }}.dmg

  create-universal-dmg:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: novacibes-editor-x86_64-apple-darwin
          path: intel

      - name: Download ARM DMG
        uses: actions/download-artifact@v4
        with:
          name: novacibes-editor-aarch64-apple-darwin
          path: arm

      - name: Extract .app bundles from DMGs
        run: |
          mkdir -p intel_mount arm_mount universal_bundle
          # Mount Intel DMG and copy .app
          hdiutil attach intel/NovaCibes-Editor-x86_64-apple-darwin.dmg -mountpoint intel_mount
          cp -R intel_mount/*.app universal_bundle/
          hdiutil detach intel_mount
          # Mount ARM DMG and copy .app
          hdiutil attach arm/NovaCibes-Editor-aarch64-apple-darwin.dmg -mountpoint arm_mount
          cp -R arm_mount/*.app "universal_bundle/NovaCibes Editor 2.app"
          hdiutil detach arm_mount

      - name: Create universal binary from the two .app bundles
        run: |
          # Discovery
          INTEL_APP=$(find universal_bundle -maxdepth 1 -name "*.app" | head -1)
          ARM_APP=$(find universal_bundle -maxdepth 1 -name "*.app" | tail -1)

          INTEL_BIN=$(ls "$INTEL_APP/Contents/MacOS/"* | head -1)
          ARM_BIN=$(ls "$ARM_APP/Contents/MacOS/"* | head -1)

          # Create universal bundle structure (copy from Intel)
          mkdir -p "final_bundle/NovaCibes Editor.app/Contents/MacOS"
          cp -R "$INTEL_APP/Contents/Info.plist" "final_bundle/NovaCibes Editor.app/Contents/"
          cp -R "$INTEL_APP/Contents/Resources" "final_bundle/NovaCibes Editor.app/Contents/"

          # Combine binaries
          lipo -create "$INTEL_BIN" "$ARM_BIN" -output "final_bundle/NovaCibes Editor.app/Contents/MacOS/NovaCibes Editor"
          chmod +x "final_bundle/NovaCibes Editor.app/Contents/MacOS/NovaCibes Editor"

      - name: Package universal .app into final DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "NovaCibes Editor" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "NovaCibes Editor.app" 200 190 \
            --hide-extension "NovaCibes Editor.app" \
            --app-drop-link 400 190 \
            "NovaCibes-Editor-universal.dmg" \
            "final_bundle/NovaCibes Editor.app"

      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-editor-universal
          path: NovaCibes-Editor-universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-universal-dmg
    runs-on: ubuntu-latest
    steps:
      - name: Download universal DMG
        uses: actions/download-artifact@v4
        with:
          name: novacibes-editor-universal
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/NovaCibes-Editor-universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
