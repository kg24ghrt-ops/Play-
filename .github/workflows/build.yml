name: Build NovaCibes Python Runner (macOS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Prepare artifact
        run: |
          mkdir -p dist
          set -euo pipefail
          mkdir -p dist

          BIN_PATH="$(find target/release -maxdepth 1 -type f -perm -111 \
            ! -name '*.d' \
            ! -name '*.rlib' \
            ! -name '*.rmeta' \
            | head -n 1)"

          if [ -z "$BIN_PATH" ]; then
            echo "No release binary found in target/release"
            ls -la target/release
            exit 1
          fi

          BIN_NAME="$(basename "$BIN_PATH")"
          cp "$BIN_PATH" "dist/$BIN_NAME"
          chmod +x "dist/$BIN_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-macos-build
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
