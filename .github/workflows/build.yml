name: Build NovaCibes Python Runner (Universal macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build binary for ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Create .app bundle for ${{ matrix.target }}
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .dmg installer for ${{ matrix.target }}
        run: |
          create-dmg \
            --volname "NovaCibes Editor" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "NovaCibes Editor.app" 200 190 \
            --hide-extension "NovaCibes Editor.app" \
            --app-drop-link 400 190 \
            "NovaCibes-Editor-${{ matrix.target }}.dmg" \
            "target/${{ matrix.target }}/release/bundle/osx/NovaCibes Editor.app"

      - name: Upload DMG for ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-editor-${{ matrix.target }}
          path: NovaCibes-Editor-${{ matrix.target }}.dmg

  create-universal-dmg:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: novacibes-editor-x86_64-apple-darwin
          path: intel

      - name: Download ARM DMG
        uses: actions/download-artifact@v4
        with:
          name: novacibes-editor-aarch64-apple-darwin
          path: arm

      - name: Extract .app bundles from DMGs
        run: |
          mkdir -p intel_mount arm_mount universal_bundle
          # Mount Intel DMG and copy .app
          hdiutil attach intel/NovaCibes-Editor-x86_64-apple-darwin.dmg -mountpoint intel_mount
          cp -R intel_mount/*.app universal_bundle/
          hdiutil detach intel_mount
          # Mount ARM DMG and copy .app
          hdiutil attach arm/NovaCibes-Editor-aarch64-apple-darwin.dmg -mountpoint arm_mount
          cp -R arm_mount/*.app universal_bundle/
          hdiutil detach arm_mount

      - name: Create universal binary from the two .app bundles
        run: |
          # Find the binaries inside the .app bundles
          INTEL_BIN=$(find universal_bundle -maxdepth 2 -name "*.app" | grep "x86_64" | head -1)/Contents/MacOS/novacibes-editor
          ARM_BIN=$(find universal_bundle -maxdepth 2 -name "*.app" | grep "aarch64" | head -1)/Contents/MacOS/novacibes-editor

          # If grep fails (names might not contain arch), fallback to listing
          if [ -z "$INTEL_BIN" ] || [ -z "$ARM_BIN" ]; then
            BINS=($(find universal_bundle -name "novacibes-editor" -path "*/Contents/MacOS/*"))
            INTEL_BIN="${BINS[0]}"
            ARM_BIN="${BINS[1]}"
          fi

          echo "Intel bin: $INTEL_BIN"
          echo "ARM bin: $ARM_BIN"

          # Create final universal bundle structure
          mkdir -p "universal_bundle/NovaCibes Editor.app/Contents/MacOS"
          cp -R "$(find universal_bundle -name "*.app" | head -1)/Contents/Info.plist" "universal_bundle/NovaCibes Editor.app/Contents/"

          lipo -create "$INTEL_BIN" "$ARM_BIN" -output "universal_bundle/NovaCibes Editor.app/Contents/MacOS/NovaCibes Editor"
          chmod +x "universal_bundle/NovaCibes Editor.app/Contents/MacOS/NovaCibes Editor"

      - name: Package universal .app into final DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "NovaCibes Editor" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "NovaCibes Editor.app" 200 190 \
            --hide-extension "NovaCibes Editor.app" \
            --app-drop-link 400 190 \
            "NovaCibes-Editor-universal.dmg" \
            "universal_bundle/NovaCibes Editor.app"

      - name: Upload universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-editor-universal
          path: NovaCibes-Editor-universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: create-universal-dmg
    runs-on: ubuntu-latest
    steps:
      - name: Download universal DMG
        uses: actions/download-artifact@v4
        with:
          name: novacibes-editor-universal
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/NovaCibes-Editor-universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
