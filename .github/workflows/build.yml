name: Build NovaCibes Python Runner (Universal macOS)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build Intel slice
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target x86_64-apple-darwin --verbose

      - name: Build Apple Silicon slice
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target aarch64-apple-darwin --verbose

      - name: Prepare universal binary
        run: |
          set -euo pipefail

          mkdir -p dist

          INTEL_BIN="target/x86_64-apple-darwin/release/novacibes-python-runner"
          ARM_BIN="target/aarch64-apple-darwin/release/novacibes-python-runner"
          OUT_BIN="dist/novacibes-python-runner"

          if [ ! -f "$INTEL_BIN" ]; then
            echo "Intel binary not found"
            ls -R target/x86_64-apple-darwin/release || true
            exit 1
          fi

          if [ ! -f "$ARM_BIN" ]; then
            echo "Apple Silicon binary not found"
            ls -R target/aarch64-apple-darwin/release || true
            exit 1
          fi

          lipo -create "$INTEL_BIN" "$ARM_BIN" -output "$OUT_BIN"
          chmod +x "$OUT_BIN"

          file "$OUT_BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacibes-macos-universal
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
