[package]
name = "novacibes-editor"
version = "0.1.0"
edition = "2021"
description = "A native macOS code editor that runs Python via a remote API."

[dependencies]
eframe = "0.34.2"
egui = "0.34.2"
egui_code_editor = "0.2.27"
reqwest = { version = "0.12.24", features = ["json"] }
tokio = { version = "1.45.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rfd = "0.17.2"
directories = "6.0.0"
once_cell = "1.21.3"

[profile.release]
opt-level = 2
strip = true
lto = true
codegen-units = 1

[package.metadata.packager]
name = "NovaCibes Editor"
identifier = "com.novacibes.editor"
version = "0.1.0"
category = "DeveloperTool"
authors = ["NovaCibes"]
description = "A native macOS code editor that runs Python via a remote API."
product_name = "NovaCibes Editor"
formats = ["app", "dmg"]

[package.metadata.packager.macos]
minimum_system_version = "11.0"

[package.metadata.bundle]
name = "NovaCibes Editor"
identifier = "com.novacibes.editor"
