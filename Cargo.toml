[package]
name = "novacibes-editor"
version = "0.1.0"
edition = "2021"
description = "A native macOS code editor that runs Python via a remote API."

[dependencies]
eframe = "0.34"
egui = "0.34"
egui_code_editor = "0.2.27"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
directories = "6"
once_cell = "1"

[package.metadata.packager]
name = "NovaCibes Editor"
identifier = "com.novacibes.editor"
version = "0.1.0"
authors = ["NovaCibes"]
product_name = "NovaCibes Editor"
formats = ["app", "dmg"]

[package.metadata.packager.macos]
minimum_system_version = "11.0"

[profile.release]
opt-level = 2
strip = true
lto = true
codegen-units = 1
