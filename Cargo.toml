[package]
name = "novacibes-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
fltk = { version = "1.4", features = ["fltk-bundled"] }   # builds FLTK from source (no brew needed)
ureq = "2.10"                                              # HTTP client
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"                                                 # standard config directory paths