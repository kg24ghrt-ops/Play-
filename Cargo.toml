[package]
name = "novacibes-editor"
version = "0.1.0"
edition = "2021"
description = "A native macOS code editor that runs Python via a remote API."

[dependencies]
eframe = "0.34.2"
egui = "0.34.2"
egui_code_editor = "0.2.27"
reqwest = { version = "0.12.12", features = ["json"] }
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rfd = "0.15.2"
directories = "6.0.0"
once_cell = "1.20.2"

[profile.release]
opt-level = 2
strip = true
lto = true
codegen-units = 1

[package.metadata.packager]
name = "NovaCibes Editor"
identifier = "com.novacibes.editor"
version = "0.1.0"
resources = ["assets/*"]

[[package.metadata.packager.binaries]]
path = "novacibes-editor"
main = true

[package.metadata.packager.macos]
minimum_system_version = "11.0"

[package.metadata.bundle]
name = "NovaCibes Editor"
identifier = "com.novacibes.editor"
version = "0.1.0"
copyright = "Copyright © 2024. All rights reserved."
category = "DeveloperTool"
short_description = "A native macOS code editor that runs Python via a remote API."
long_description = "A native macOS code editor that runs Python via a remote API."
